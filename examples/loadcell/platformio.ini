; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
; 
; Note the board name is defined in e.g. ~/.platformio/platforms/espressif32/boards/ttgo-lora32-v21.json
; and variants are in ~/.platformio/packages/framework-arduinoespressif32/variants/
; or ~/.platformio/packages/framework-arduinoespressif8266/variants


; custom common options

[platformio]
; Anything matching *-local.ini is loaded on top of this file, and is not committed: that is where
; the enrolment secret goes, and which server this build is for. A GLOB rather than a name, so a
; checkout with no such file builds unchanged instead of erroring.
extra_configs = *-local.ini

name: Frugal-IoT Loadcell
description: Frugal IoT - Loadcell scales application, with a local menu driven by buttons
src_dir = .
;This src_dir line should be present if your program is in xxx.ino or commented out if your program is in src/main.cpp

[common]
lib_deps = 
    Frugal-IoT@^2.0.12
    ; Libraries specific to this hardware - sensor, actuator, etc
    ; robtillaart/SHT85 ; included by frugal-iot (in library.json & library.properties)
 
lib_deps_lora = 
    ${common.lib_deps}
    ;Comment/Uncomment below two lines to switch between live and "new" version
    ;jaimi5/LoRaMesher
    ;Comment/Uncomment below to switch between upstream and our fork.
        https://github.com/loramesher/LoRaMesher.git
    ;https://github.com/mitra42/LoRaMesher.git#perf/avoid-iostreams
    ;https://github.com/mitra42/LoRaMesher.git#new_loramesher

lib_deps_lora_oled =
    ${common.lib_deps_lora}
    adafruit/Adafruit SSD1306@^2.5.0
    adafruit/Adafruit GFX Library@^1.10.13
    ; adafruit/Adafruit BusIO@^1.14.0  ; transitive dep of Adafruit GFX; chain LDF doesn't auto-resolve; unclear if still needed for any boards


; These are flags common to pretty much all frugal-iot projects
; comment or uncomment debug flags based on need
build_flags_frugaliot =
    ;Flags usable in specific modules - mostly here for documentation
    ;'-D LANGUAGE_DEFAULT="id"'         ; Default language for portal (if not en) - de,nl,id currently supported
    ;-D ACTUATOR_LCD_WANT
    ;-D ACTUATOR_LCD_COLS=20            ; uncomment for 20x4 display (default is 16x2)
    ;-D ACTUATOR_LCD_ROWS=4
    ;-D SENSOR_BATTERY_PIN=0            ; Read battery voltage on pin 0 as its external (note pin 5 failed for some reason)
    ;-D SENSOR_BATTERY_VOLTAGE_DIVIDER=2 ; Typically use a 100k+100k voltage divider on external power supplies
    ;-D SENSOR_DS18B20_PIN=6
    ;-D SENSOR_SOIL_PIN=4
    ; The ultrasonic sensor talks Modbus over RS485. Its slave id switches on SYSTEM_MODBUS_WANT,
    ; which then needs the UART pins as well - all three, or system/modbus.h stops the build with
    ; an #error. Costs ~20k of flash (ModbusMaster + the RS485/Modbus classes).
    ;-D SENSOR_ULTRASONIC_SLAVE_ID=1
    ;-D SYSTEM_RS485_RX_PIN=20
    ;-D SYSTEM_RS485_TX_PIN=21
    ;-D SYSTEM_SD_WANT                  ; Uses LittleFS by default
    ;-D SYSTEM_WIFI_SCANPERIOD=50000    ; Slow down scanning so can easier debug captive portal
    ; Flags from other libraries
    ;-D LORAMESHER_LOG_LEVEL=2          ; 0 is LOTS of debugging 2 is less
    ;-D DEBUG_DNSSERVER ; If captive portal not seeing requests - as happening on ESP8266
    ;-fno-exceptions ; save ~75k (unset for LoRaMesher boards)
    ; Uncomment debug lines before as needed
    ;-D ACTUATOR_LCD_DEBUG
    ;-D CONTROL_BLINKEN_DEBUG
    ;-D CONTROL_CLIMATE_DEBUG
    ;-D CONTROL_LOGGERFS_DEBUG
    ;-D SENSOR_BH1750_DEBUG
    ;-D SENSOR_DHT_DEBUG 
    ;-D SENSOR_AHT_DEBUG
    ;-D SENSOR_ENS160_DEBUG
    ;-D SENSOR_LOADCELL_DEBUG
    ;-D CONTROL_MENU_DEBUG
    ;-D CONTROL_MENU_CAPTIVE_WANT      ; the menu on the captive portal page as well
    ;'-D CONTROL_MENU_LCD_NODE="esp32-12bc34"' ; the menu on the LCD of that node, rather than one on this node
    ;-D SENSOR_MS5803_DEBUG
    ;-D SENSOR_SHT_DEBUG
    ;-D SENSOR_SOIL_DEBUG
    ;-D SYSTEM_DISCOVERY_DEBUG
    ;-D SYSTEM_FRUGAL_DEBUG
    ;-D SYSTEM_LITTLEFS_DEBUG
    -D SYSTEM_LITTLEFS_SUPPORTDEPRECATED ; one-shot migration old to new file format, remove when none left in field
    ;-D SYSTEM_FS_DEBUG_DIR       ; List the whole LittleFS directory tree at boot
    ;-D SYSTEM_MEMORY_DEBUG ; cos seeing intermittent crash after some period (>7 mins)
    ;-D SYSTEM_MESSAGE_DEBUG ; report messages received, sent, looped etc
    ;-D SYSTEM_MQTT_DEBUG
    ;-D SYSTEM_OTA_DEBUG
    ;-D SYSTEM_POWER_DEBUG
    ;-D SYSTEM_TIME_DEBUG
    ;-D SYSTEM_WIFI_DEBUG

; Filled in by the *-local.ini files, which are never committed. Empty here, so this file can be
; committed and a checkout without them still builds. Two keys rather than one because a value set
; in a *-local.ini REPLACES the one here rather than adding to it, so each file needs its own:
;   build_flags_secrets - platformio-secrets-local.ini: the enrolment secret, and which server
;                         this build is for. ota_build.py --secrets links it into every example.
;   build_flags_local   - platformio-local.ini: your own debug flags. Never reaches an OTA build.
build_flags_secrets =
build_flags_local =

; flags that apply only in main (the library can see them, but doesnt need them)
build_flags_main =
    ${common.build_flags_secrets}
    ${common.build_flags_local}

; project specific flags that are needed by the library 
; - being phased out (apart from debug flags) in favor of parameters from main.cpp
; but may be used where impact is across files, especially temporarily, for example where refactoring
build_flags_library = 
    '-D SYSTEM_OTA_PREFIX="loadcell"'

; LoRaMesher throws, so the boards that use it need C++ exceptions back on. build_unflags REMOVES
; -fno-exceptions rather than countering it with -fexceptions - measured as byte-identical to a
; build that never had the flag, where -fexceptions would have cost 6,232 bytes.
build_unflags_loramesher =
    -fno-exceptions

; build flags that only relate to boards with LoRaMesher
build_flags_loramesher = 
    ; LoRaMesher, for now, has a lot of flags here, will move some of this to main.cpp
    ; Both the t3_s3 and the ttgo boards we are testing use the same module
    ; feel free to move into per-board [env] (and submit a PR) if your own setup differs
    -D SYSTEM_LORAMESHER_FREQUENCY=915.0F ; 868.0F for Europe, 915.0F for US/AU; 433.0F for Asia
    ;-D LORA_DUTY_CYCLE=0.01f ; Uncomment for 868.0F (Europe), legally limited to 1% of airtime. Default 5% - see loramesher.cpp
    ;-D SYSTEM_LORAMESHER_DEBUG ; to get debugging at the app (not LoRaMesher or Radio) layers
    ;-D CORE_DEBUG_LEVEL=5 ; To get lots of debugging out of LoraMesher
    ;-D RADIOLIB_DEBUG_BASIC ; Debugging from RadioLib 

; Ask the linker for a map file. scripts/size_report.py reads it to say which archive members
; were linked in and which symbol pulled each one - the definitive answer to "is code from a
; sensor I am not using taking up flash". Build-time only, nothing reaches the device.
build_flags_map =
    -Wl,-Map=$BUILD_DIR/firmware.map

; AsyncTCP's service task stack, which is HEAP, not static - so it does not show up in the RAM
; figure at the end of a build, and that is why it went unnoticed.
;
; The library defaults it to 8192*2, sixteen kilobytes, which is the same size as one of mbedTLS's
; two TLS record buffers. The captive portal's handlers are a form POST, a status page and a couple
; of redirects - nothing that needs half of that. On an S2, where TinyUSB has already taken 23KB
; of internal RAM, those sixteen kilobytes are the difference between a TLS handshake that fits and
; one that returns "SSL - Memory allocation failed".
;
; A plain -D works because AsyncTCP.h declares it with #ifndef. Nothing needs rebuilding: this is
; not an sdkconfig setting.
;
; 8192 moved an S2 from "cannot allocate the record buffers" to "failed during chain verification" -
; further in, still short. 4096 is the next step and is still generous for handlers that parse a
; small form and print a status page. Raise it again if a portal handler ever does real work.
build_flags_async =
    -D CONFIG_ASYNC_TCP_STACK_SIZE=4096

; Pins for each board. Buttons go between the pin and GND; SENSOR_BUTTON_BACK_PIN is optional, and
; without it each menu ends in a "Back" row.
; S2 Mini: the load cell is on 33/35, as it always has been in this example - except with an LCD or
; OLED, which need 33/35 for I2C, so build_flags_pins_s2_mini_i2c moves it to 16/18.
build_flags_pins_s2_mini_buttons =
    -D SENSOR_BUTTON_UP_PIN=3
    -D SENSOR_BUTTON_DOWN_PIN=5
    -D SENSOR_BUTTON_ACCEPT_PIN=7
    -D SENSOR_BUTTON_BACK_PIN=9
build_flags_pins_s2_mini =
    -D SENSOR_LOADCELL_DOUTPIN=33
    -D SENSOR_LOADCELL_SCKPIN=35
    ${common.build_flags_pins_s2_mini_buttons}
build_flags_pins_s2_mini_i2c =
    -D SENSOR_LOADCELL_DOUTPIN=16
    -D SENSOR_LOADCELL_SCKPIN=18
    ${common.build_flags_pins_s2_mini_buttons}
; C3 with 72x40 OLED: 5 and 6 are the OLED's I2C, 8 its LED, 9 the boot button. Not checked against a board yet.
build_flags_pins_c3_oled_72x40 =
    -D SENSOR_LOADCELL_DOUTPIN=0
    -D SENSOR_LOADCELL_SCKPIN=1
    -D SENSOR_BUTTON_UP_PIN=3
    -D SENSOR_BUTTON_DOWN_PIN=4
    -D SENSOR_BUTTON_ACCEPT_PIN=10
    -D SENSOR_BUTTON_BACK_PIN=7
; D1 Mini: the free pins that are not boot straps run out at three, so it has no back button.
build_flags_pins_d1_mini =
    -D SENSOR_LOADCELL_DOUTPIN=4    ; D2
    -D SENSOR_LOADCELL_SCKPIN=5     ; D1
    -D SENSOR_BUTTON_UP_PIN=14      ; D5
    -D SENSOR_BUTTON_DOWN_PIN=12    ; D6
    -D SENSOR_BUTTON_ACCEPT_PIN=13  ; D7

; Flags specific to project, but vary across dev-boards or variants
build_flags = 
    ${common.build_flags_frugaliot}
    ${common.build_flags_main}
    ${common.build_flags_library}
    ${common.build_flags_map}
    ${common.build_flags_async}
   
; selecting a platform for board descriptions
;platform_esp32 = espressif32 @ ~8.0.0 ; released oct 2026, if problems switch back to the github one 
platform_esp32 = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip ; works in both PlatformIO and PIOArduino extensions
;platform_packages = framework-arduinoespressif32@3.3.2 ; also possible, but mostly unneeded and wont always work

[env]
monitor_speed = 460800 ; If not 460800 then also change in main.cpp: frugal_iot.startSerial(newspeed, 5000);
upload_speed = 460800
framework = arduino
; Unclear if next line causes problems either way - if commented out then doesnt recognize uploaded system 
board_build.filesystem = littlefs ; Use LittleFS instead of SPIFFS
lib_compat_mode = strict
lib_deps =  ${common.lib_deps}
lib_ldf_mode = chain
;Uncomment, if seeing exceptions need decoding
; build_type = debug
; monitor_filters = esp8266_exception_decoder
; monitor_filters = esp32_exception_decoder

[env:s2_mini]
platform = ${common.platform_esp32}
board = lolin_s2_mini ; defines ARDUINO_LOLIN_S2_MINI
board_build.partitions = min_spiffs.csv
build_flags = 
    ${common.build_flags}
    '-D SYSTEM_OTA_SUFFIX="s2_mini"'
    ${common.build_flags_pins_s2_mini}

[env:s2_mini_lcd] ; HD44780 LCD on an I2C backpack, on the S2 Mini's I2C - SDA 33, SCL 35
platform = ${common.platform_esp32}
board = lolin_s2_mini ; defines ARDUINO_LOLIN_S2_MINI
board_build.partitions = min_spiffs.csv
build_flags = 
    ${common.build_flags}
    '-D SYSTEM_OTA_SUFFIX="s2_mini_lcd"'
    ${common.build_flags_pins_s2_mini_i2c}
    -D ACTUATOR_LCD_WANT
    ;-D ACTUATOR_LCD_COLS=20 ; uncomment for a 20x4 display (default is 16x2)
    ;-D ACTUATOR_LCD_ROWS=4

[env:s2_mini_oled] ; external 128x64 SSD1306 OLED, on the S2 Mini's I2C - SDA 33, SCL 35
platform = ${common.platform_esp32}
board = lolin_s2_mini ; defines ARDUINO_LOLIN_S2_MINI
board_build.partitions = min_spiffs.csv
build_flags = 
    ${common.build_flags}
    '-D SYSTEM_OTA_SUFFIX="s2_mini_oled"'
    ${common.build_flags_pins_s2_mini_i2c}
    -D OLED_WIRE=Wire
    -D OLED_SDA=33 ; defining OLED_SDA also defines ACTUATOR_OLED_WANT
    -D OLED_SCL=35
    -D OLED_RST_X=-1
    -D ACTUATOR_OLED_IS_SSD1306
    -D ACTUATOR_OLED_WIDTH=128
    -D ACTUATOR_OLED_HEIGHT=64
lib_deps = 
    ${common.lib_deps}
    adafruit/Adafruit SSD1306@^2.5.0
    adafruit/Adafruit GFX Library@^1.10.13

[env:c3_oled_72x40] ; the small ESP32-C3 board with a built-in 72x40 OLED
platform = ${common.platform_esp32}
board = lolin_c3_mini ; use c3_mini board defs - but note define below which is special cased
board_build.variant = lolin_c3_pico
build_flags = 
    ${common.build_flags}
    '-D SYSTEM_OTA_SUFFIX="c3_oled_72x40"'
    ${common.build_flags_pins_c3_oled_72x40}
    -D ARDUINO_C3_OLED_72x40 ; if using the C3/small OLED board define here
    -D ACTUATOR_OLED_WANT
lib_deps = 
    ${common.lib_deps}
    adafruit/Adafruit SSD1306@^2.5.0
    adafruit/Adafruit GFX Library@^1.10.13
board_build.partitions = min_spiffs.csv

; ==== ESP8266 boards ================================================

[env:d1_mini_pro] ; Including V2 (Green) V3 (ext antenna) V4 (I2C)
platform = espressif8266
board = d1_mini_pro
build_flags = 
    ${common.build_flags}
    '-D SYSTEM_OTA_SUFFIX="d1_mini_pro"'
    ${common.build_flags_pins_d1_mini}
board_build.partitions = min_spiffs.csv

[env:d1_mini] ; also for d1_mini_pro v2 (green) or 4Mb v3 (blue) which does not work with d1_mini_pro board defs
board = d1_mini
platform = espressif8266
build_flags =
    ${common.build_flags}
    '-D SYSTEM_OTA_SUFFIX="d1_mini"'
    ${common.build_flags_pins_d1_mini}

; ==== Bench tests ===================================================
; For trying out the menu's displays and buttons. None has a load cell, and all but test2 are on
; the C3 with the 72x40 OLED, using its boot button. CONTROL_MENU_DEBUG prints each key press.
; OTA suffixes are test<n> so that no release build is offered over the top of them.

[env:test1] ; C3 72x40 OLED, one button (boot, GPIO9): Serial and the small OLED
platform = ${common.platform_esp32}
board = lolin_c3_mini
board_build.variant = lolin_c3_pico
board_build.partitions = min_spiffs.csv
build_flags = 
    ${common.build_flags}
    '-D SYSTEM_OTA_SUFFIX="test1"'
    -D ARDUINO_C3_OLED_72x40
    -D ACTUATOR_OLED_WANT
    -D SENSOR_BUTTON_ONE_PIN=9 ; the boot button - BUILTIN_BUTTON in _settings.h
    -D CONTROL_MENU_DEBUG
lib_deps = 
    ${common.lib_deps}
    adafruit/Adafruit SSD1306@^2.5.0
    adafruit/Adafruit GFX Library@^1.10.13

[env:test2] ; Heltec WiFi LoRa 32 V3.2, one button (PRG, GPIO0): Serial and the 128x64 OLED
platform = ${common.platform_esp32}
board = heltec_wifi_lora_32_V3  ; defines ARDUINO_heltec_wifi_lora_32_V3, which brings in LoRaMesher and the OLED
build_flags = 
    ${common.build_flags}
    -D ARDUINO_heltec_wifi_lora_32_V32
    '-D SYSTEM_OTA_SUFFIX="test2"'
    ${common.build_flags_loramesher}
    -D SENSOR_BUTTON_ONE_PIN=0 ; PRG - BUTTON_BUILTIN in _settings.h
    -D CONTROL_MENU_DEBUG
build_unflags = ${common.build_unflags_loramesher}
lib_deps = 
    ${common.lib_deps_lora_oled}

[env:test3] ; as test1, plus the LCD on another node, over MQTT
platform = ${common.platform_esp32}
board = lolin_c3_mini
board_build.variant = lolin_c3_pico
board_build.partitions = min_spiffs.csv
build_flags = 
    ${common.build_flags}
    '-D SYSTEM_OTA_SUFFIX="test3"'
    -D ARDUINO_C3_OLED_72x40
    -D ACTUATOR_OLED_WANT
    -D SENSOR_BUTTON_ONE_PIN=9
    -D CONTROL_MENU_DEBUG
    '-D CONTROL_MENU_LCD_NODE="esp32-xxxxxx"' ; CHANGE to the node id of the node with the LCD (same org and project)
lib_deps = 
    ${common.lib_deps}
    adafruit/Adafruit SSD1306@^2.5.0
    adafruit/Adafruit GFX Library@^1.10.13

[env:test4] ; as test1, plus the menu and four buttons on the captive portal
platform = ${common.platform_esp32}
board = lolin_c3_mini
board_build.variant = lolin_c3_pico
board_build.partitions = min_spiffs.csv
build_flags = 
    ${common.build_flags}
    '-D SYSTEM_OTA_SUFFIX="test4"'
    -D ARDUINO_C3_OLED_72x40
    -D ACTUATOR_OLED_WANT
    -D SENSOR_BUTTON_ONE_PIN=9
    -D CONTROL_MENU_DEBUG
    -D CONTROL_MENU_CAPTIVE_WANT
lib_deps = 
    ${common.lib_deps}
    adafruit/Adafruit SSD1306@^2.5.0
    adafruit/Adafruit GFX Library@^1.10.13
