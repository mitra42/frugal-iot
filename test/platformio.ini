; Frugal-IoT tests - run on a real board, with no sensors attached.
;
;   cd test
;   pio test -e c3_pico                       ; build, upload, run every suite, report
;   pio test -e c3_pico -f test_hysteresis    ; one suite
;   pio test -e c3_pico --without-uploading --without-testing   ; just check they compile
;
; THE BOARD'S FILESYSTEM IS FORMATTED at the start of every suite - WiFi credentials and all - so
; use a board you do not mind wiping. See README.md in this directory.
;
; ESP32 only so far. A d1_mini env built the library but not the suite: unity.h was installed and
; still not on the include path, with lib_compat_mode strict or soft. Not chased further.

[platformio]
test_dir = suites      ; each test_* folder in it is one suite = one firmware = one node
                       ; not ".", which also collects the example tests inside .pio/libdeps/Unity
; lib/ here holds FrugalTest, the shared helpers

[common]
platform_esp32 = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip

[env]
platform = ${common.platform_esp32}
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps =
    symlink://..         ; the library in this working tree, not a published copy
    FrugalTest           ; in lib/ here - named, as the finder does not scan the suites' #includes
    ; Both listed by hand: PlatformIO drops a dependency with a "platforms" filter when the env's
    ; platform is a URL, as pioarduino's is ("Warning: Ignored `ESPAsyncWebServer` dependency" in
    ; pio test -vvv), and ESPAsyncWebServer's own dependency on AsyncTCP has one too.
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP
test_speed = 460800      ; Unity's Serial.begin - must match SERIAL_BAUD, as the library may begin Serial too
monitor_speed = 460800
upload_speed = 460800
build_flags =
    -fno-exceptions
    ;-D SYSTEM_MESSAGE_DEBUG   ; every message queued, updated and dispatched

[env:c3_pico]
board = lolin_c3_mini
board_build.variant = lolin_c3_pico
build_flags = ${env.build_flags} -D ARDUINO_LOLIN_C3_PICO

[env:supermini]
board = nologo_esp32c3_super_mini

[env:s2_mini]
board = lolin_s2_mini

[env:nodemcu-32s]
board = nodemcu-32s
